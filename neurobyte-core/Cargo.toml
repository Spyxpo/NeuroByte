[package]
name = "neurobyte-core"
version = "0.1.0"
edition = "2021"
description = "Fast Rust backend for NeuroByte AI coding assistant"
authors = ["NeuroByte Team"]
license = "MIT"

[lib]
name = "neurobyte_core"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "neurobyte-server"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# HTTP server and client
axum = { version = "0.7", features = ["json", "ws"] }
reqwest = { version = "0.11", features = ["json", "stream"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# File system operations
walkdir = "2.4"
ignore = "0.4"
notify = "6.1"
glob = "0.3"

# Text processing
tree-sitter = "0.20"
regex = "1.10"
similar = "2.4"

# System info for device detection
sysinfo = "0.30"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Async channels
tokio-stream = "0.1"
futures = "0.3"

# UUID for request tracking
uuid = { version = "1.6", features = ["v4"] }

# Process management for Ollama
which = "6.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
